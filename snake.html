<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake</title>
<style>
  :root {
    --void: #0d0221;
    --panel: #1a0533;
    --board: #12032a;
    --purple: #b026ff;
    --pink: #ff2bd6;
    --pink-soft: #ff9cf0;
    --lavender: #e0aaff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(circle at 50% 30%, #2a0a4d 0%, var(--void) 70%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Courier New", Courier, monospace;
    color: var(--lavender);
    padding: 16px;
  }
  .device {
    background: var(--panel);
    border: 3px solid var(--purple);
    border-radius: 12px;
    padding: 12px;
    box-shadow: 0 0 12px var(--purple), 0 0 40px rgba(176, 38, 255, .45), inset 0 0 20px rgba(176, 38, 255, .25);
    width: min(92vw, 460px);
  }
  .hud {
    display: flex;
    justify-content: space-between;
    font-weight: bold;
    font-size: clamp(13px, 3.4vw, 18px);
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 4px 6px 10px;
    border-bottom: 2px solid var(--pink);
    margin-bottom: 10px;
    color: var(--pink-soft);
    text-shadow: 0 0 8px var(--pink);
  }
  .board-wrap { position: relative; }
  canvas {
    display: block;
    width: 100%;
    aspect-ratio: 1 / 1;
    background: var(--board);
    border: 3px solid var(--pink);
    box-shadow: 0 0 12px var(--pink), inset 0 0 16px rgba(255, 43, 214, .25);
    image-rendering: pixelated;
  }
  .overlay {
    position: absolute;
    inset: 3px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: rgba(13, 2, 33, .88);
    gap: 8px;
    text-transform: uppercase;
  }
  .overlay.hidden { display: none; }
  .overlay h1 {
    margin: 0;
    font-size: clamp(22px, 7vw, 36px);
    letter-spacing: 3px;
    color: var(--pink);
    text-shadow: 0 0 10px var(--pink), 0 0 24px var(--purple);
  }
  .overlay p { margin: 0; font-size: clamp(11px, 3vw, 14px); color: var(--lavender); }
  .blink { animation: blink 1s steps(2, start) infinite; color: var(--pink-soft) !important; }
  @keyframes blink { to { visibility: hidden; } }
  .controls {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 12px;
  }
  button {
    font: inherit;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 1px;
    background: transparent;
    color: var(--pink-soft);
    border: 2px solid var(--purple);
    padding: 8px 16px;
    cursor: pointer;
    border-radius: 4px;
    box-shadow: 0 0 8px rgba(176, 38, 255, .6);
    text-shadow: 0 0 6px var(--pink);
  }
  button:hover { background: var(--purple); color: var(--void); text-shadow: none; }
  button:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; }
</style>
</head>
<body>
  <main class="device">
    <div class="hud">
      <span>Score <span id="score">0</span></span>
      <span>Best <span id="best">0</span></span>
      <span>Lv <span id="level">1</span></span>
    </div>
    <div class="board-wrap">
      <canvas id="board" width="400" height="400" aria-label="Snake game board"></canvas>
      <div id="overlay" class="overlay">
        <h1 id="overlay-title">Snake</h1>
        <p id="overlay-text">Arrows / WASD to move</p>
        <p class="blink">Press Enter to start</p>
      </div>
    </div>
    <div class="controls">
      <button id="pause-btn" type="button">Pause</button>
      <button id="restart-btn" type="button">Restart</button>
    </div>
  </main>

<script>
(function () {
  "use strict";

  var GRID = 20;
  var CELL = 20;
  var BASE_DELAY = 150;
  var MIN_DELAY = 55;
  var FOODS_PER_LEVEL = 5;
  var STORAGE_KEY = "snake-best-score";

  var C_BG = "#12032a";
  var C_GRID = "rgba(176, 38, 255, 0.10)";
  var C_HEAD = "#ff2bd6";
  var C_BODY = "#b026ff";
  var C_FOOD = "#ff9cf0";

  var canvas = document.getElementById("board");
  var ctx = canvas.getContext("2d");
  var scoreEl = document.getElementById("score");
  var bestEl = document.getElementById("best");
  var levelEl = document.getElementById("level");
  var overlay = document.getElementById("overlay");
  var overlayTitle = document.getElementById("overlay-title");
  var overlayText = document.getElementById("overlay-text");
  var overlayHint = overlay.querySelector(".blink");
  var pauseBtn = document.getElementById("pause-btn");
  var restartBtn = document.getElementById("restart-btn");

  var snake, dir, dirQueue, food, score, level, best, timer;
  var state = "ready"; // ready | running | paused | over

  function loadBest() {
    try { return parseInt(localStorage.getItem(STORAGE_KEY), 10) || 0; }
    catch (e) { return 0; }
  }
  function saveBest(v) {
    try { localStorage.setItem(STORAGE_KEY, String(v)); } catch (e) {}
  }

  function reset() {
    var mid = Math.floor(GRID / 2);
    snake = [{ x: mid, y: mid }, { x: mid - 1, y: mid }, { x: mid - 2, y: mid }];
    dir = { x: 1, y: 0 };
    dirQueue = [];
    score = 0;
    level = 1;
    placeFood();
    updateHud();
    draw();
  }

  function placeFood() {
    var free = [];
    for (var x = 0; x < GRID; x++) {
      for (var y = 0; y < GRID; y++) {
        if (!snake.some(function (s) { return s.x === x && s.y === y; })) {
          free.push({ x: x, y: y });
        }
      }
    }
    food = free.length ? free[Math.floor(Math.random() * free.length)] : null;
  }

  function updateHud() {
    scoreEl.textContent = score;
    bestEl.textContent = best;
    levelEl.textContent = level;
  }

  function delay() {
    return Math.max(MIN_DELAY, BASE_DELAY - (level - 1) * 12);
  }

  function showOverlay(title, text, hint) {
    overlayTitle.textContent = title;
    overlayText.textContent = text;
    overlayHint.textContent = hint;
    overlay.classList.remove("hidden");
  }
  function hideOverlay() { overlay.classList.add("hidden"); }

  function start() {
    reset();
    state = "running";
    hideOverlay();
    pauseBtn.textContent = "Pause";
    schedule();
  }

  function schedule() {
    clearTimeout(timer);
    timer = setTimeout(tick, delay());
  }

  function togglePause() {
    if (state === "running") {
      state = "paused";
      clearTimeout(timer);
      pauseBtn.textContent = "Resume";
      showOverlay("Paused", "Space to resume", "");
    } else if (state === "paused") {
      state = "running";
      pauseBtn.textContent = "Pause";
      hideOverlay();
      schedule();
    }
  }

  function gameOver() {
    state = "over";
    clearTimeout(timer);
    if (score > best) {
      best = score;
      saveBest(best);
    }
    updateHud();
    showOverlay("Game Over", "Score " + score, "Press Enter to retry");
  }

  function tick() {
    if (state !== "running") return;
    if (dirQueue.length) dir = dirQueue.shift();

    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    var eating = food && head.x === food.x && head.y === food.y;

    // Tail moves away this tick unless we are growing.
    var body = eating ? snake : snake.slice(0, -1);
    var hitWall = head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID;
    var hitSelf = body.some(function (s) { return s.x === head.x && s.y === head.y; });
    if (hitWall || hitSelf) {
      draw();
      gameOver();
      return;
    }

    snake.unshift(head);
    if (eating) {
      score += 1;
      level = 1 + Math.floor(score / FOODS_PER_LEVEL);
      placeFood();
      if (score > best) { best = score; saveBest(best); }
      updateHud();
    } else {
      snake.pop();
    }

    draw();
    if (!food) { gameOver(); return; }
    schedule();
  }

  function drawCell(x, y, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x * CELL + 1, y * CELL + 1, CELL - 2, CELL - 2);
  }

  function draw() {
    ctx.shadowBlur = 0;
    ctx.fillStyle = C_BG;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Faint neon grid lines.
    ctx.fillStyle = C_GRID;
    for (var g = 1; g < GRID; g++) {
      ctx.fillRect(g * CELL, 0, 1, canvas.height);
      ctx.fillRect(0, g * CELL, canvas.width, 1);
    }

    ctx.shadowBlur = 12;

    if (food) {
      // Plus-shaped pixel food, distinct from the snake's square blocks.
      var fx = food.x * CELL, fy = food.y * CELL;
      ctx.shadowColor = C_FOOD;
      ctx.fillStyle = C_FOOD;
      ctx.fillRect(fx + 7, fy + 2, 6, 16);
      ctx.fillRect(fx + 2, fy + 7, 16, 6);
    }

    snake.forEach(function (s, i) {
      var c = i === 0 ? C_HEAD : C_BODY;
      ctx.shadowColor = c;
      drawCell(s.x, s.y, c);
    });

    // Dark inner core on body segments for a hollow neon-tube look.
    ctx.shadowBlur = 0;
    ctx.fillStyle = C_BG;
    for (var i = 1; i < snake.length; i++) {
      ctx.fillRect(snake[i].x * CELL + 6, snake[i].y * CELL + 6, 8, 8);
    }
  }

  function steer(nx, ny) {
    if (state !== "running") return;
    var last = dirQueue.length ? dirQueue[dirQueue.length - 1] : dir;
    if (nx === -last.x && ny === -last.y) return; // no reversing
    if (nx === last.x && ny === last.y) return;
    if (dirQueue.length < 2) dirQueue.push({ x: nx, y: ny });
  }

  var KEYS = {
    ArrowUp: [0, -1], w: [0, -1], W: [0, -1],
    ArrowDown: [0, 1], s: [0, 1], S: [0, 1],
    ArrowLeft: [-1, 0], a: [-1, 0], A: [-1, 0],
    ArrowRight: [1, 0], d: [1, 0], D: [1, 0]
  };

  document.addEventListener("keydown", function (e) {
    if (KEYS[e.key]) {
      e.preventDefault();
      steer(KEYS[e.key][0], KEYS[e.key][1]);
    } else if (e.key === " ") {
      e.preventDefault();
      if (state === "running" || state === "paused") togglePause();
      else start();
    } else if (e.key === "Enter") {
      e.preventDefault();
      if (state === "ready" || state === "over") start();
    }
  });

  pauseBtn.addEventListener("click", function () {
    if (state === "ready" || state === "over") start();
    else togglePause();
    pauseBtn.blur();
  });
  restartBtn.addEventListener("click", function () {
    start();
    restartBtn.blur();
  });

  best = loadBest();
  reset();
})();
</script>
</body>
</html>
